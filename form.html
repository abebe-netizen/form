
<!DOCTYPE html>
<html>
<head>
    <title>Login and Registration</title>
    <link rel="stylesheet" href="formming.css">
</head>

<body>

    <!-- Registration Form -->
    <div class="container" id="register">

        <h2>Create Account</h2>

        <form>
            <input type="text" placeholder="Full Name" required>

            <input type="number" placeholder="Age" required>

            <input type="email" placeholder="Email Address" required>

            <input type="password" placeholder="Password" required>

            <!-- Gender Radio Buttons -->
            <div class="gender">
                <label>Gender:</label><br><br>

                <input type="radio" name="gender" value="male">
                <label>Male</label>

                <input type="radio" name="gender" value="female">
                <label>Female</label>
            </div>

            <!-- Country Dropdown -->
            <label for="country">Country:</label>

            <select id="country" name="country">
                <option value="">Select Country</option>
                <option value="ethiopia">Ethiopia</option>
                <option value="kenya">Kenya</option>
                <option value="usa">USA</option>
            </select>

            <!-- Hobbies Checkboxes -->
            <div class="hobbies">
                <label>Hobbies:</label><br><br>

                <input type="checkbox" name="hobby" value="football">
                <label>Football</label>

                <input type="checkbox" name="hobby" value="music">
                <label>Music</label>

                <input type="checkbox" name="hobby" value="reading">
                <label>Reading</label>
            </div>

            <button type="submit"
            onclick="
            alarm('you are registerd sucessfully');
            "
            >
                Register</button>
        </form>

        <p>
            Already have an account?
            <a href="#" onclick="showLogin()">Login</a>
        </p>

    </div>


    <!-- Login Form -->
    <div class="container" id="login" style="display: none;">

        <h2>Welcome Back</h2>

        <form>
            <input type="email" placeholder="Email Address" required>

            <input type="password" placeholder="Password" required>

            <button type="submit" onclick="
            alarm('welcome back to registration form');
            ">Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="#" onclick="showRegister()">Create Account</a>
        </p>

    </div>


    <!-- JavaScript -->
    <script>
        function showLogin() {
            document.getElementById("register").style.display = "none";
            document.getElementById("login").style.display = "block";
        }

        function showRegister() {
            document.getElementById("login").style.display = "none";
            document.getElementById("register").style.display = "block";
        }
    </script>

</body>
</html>
